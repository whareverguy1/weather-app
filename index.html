<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-center">Weather App</h1>
        
        <!-- Search Form -->
        <form id="weather-form" class="flex gap-2 mb-6">
            <input 
                type="text" 
                id="city-input" 
                placeholder="Enter city name..." 
                class="flex-1 px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500"
                required
            >
            <button 
                type="submit" 
                class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl font-medium transition"
            >
                Search
            </button>
        </form>

        <!-- Loading & Error Messages -->
        <div id="loading" class="hidden text-center text-slate-400 mb-4">Loading weather data...</div>
        <div id="error-message" class="hidden text-center text-red-400 mb-4"></div>

        <!-- Weather Display Card -->
        <div id="weather-card" class="hidden text-center bg-slate-800/50 p-6 rounded-xl border border-slate-700/50">
            <h2 id="city-name" class="text-xl font-semibold text-slate-200"></h2>
            <p id="temp" class="text-5xl font-extrabold my-3 text-blue-400"></p>
            <p id="description" class="capitalize text-slate-300"></p>
        </div>
    </div>

    <script>
        const apiKey = '80c725211bce1e69bcc50acde32b976b'; // Replace with your free OpenWeatherMap API key

        const form = document.getElementById('weather-form');
        const cityInput = document.getElementById('city-input');
        const loadingDiv = document.getElementById('loading');
        const errorDiv = document.getElementById('error-message');
        const weatherCard = document.getElementById('weather-card');
        const cityName = document.getElementById('city-name');
        const tempElem = document.getElementById('temp');
        const descElem = document.getElementById('description');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const city = cityInput.value.trim();
            if (!city) return;

            // Reset UI states
            loadingDiv.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            weatherCard.classList.add('hidden');

            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`
                );

                if (!response.ok) {
                    throw new Error('City not found. Please try again.');
                }

                const data = await response.json();

                // Update UI with real weather data
                cityName.textContent = `${data.name}, ${data.sys.country}`;
                tempElem.textContent = `${Math.round(data.main.temp)}°C`;
                descElem.textContent = data.weather[0].description;

                weatherCard.classList.remove('hidden');
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
            } finally {
                loadingDiv.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
